[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
exclude = ["firmware/rp2040-embassy", "firmware/stm32f103c6-embassy"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
my-canvas-core = { path = "crates/core" }
my-canvas-ui = { path = "crates/ui" }
uplc-vm = { path = "crates/vm" }

egui = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "wgpu",
    "x11",
] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self_update = { version = "1.3", default-features = false, features = [
    "reqwest",
    "rustls",
    "github",
    "archive-tar",
    "archive-zip",
    "compression-tar-gz",
    "compression-zip-deflate",
] }
