[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
my-canvas-core = { path = "crates/core" }
my-canvas-ui = { path = "crates/ui" }

egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
