<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="280" height="320">
  <rect width="280" height="320" rx="18" fill="#FFFFFF"/>
  <!-- PromptPay Header Bar -->
  <rect x="0" y="0" width="280" height="52" rx="18" fill="#1E3A8A"/>
  <rect x="0" y="28" width="280" height="24" fill="#1E3A8A"/>
  <text x="140" y="33" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" letter-spacing="1">PromptPay • พร้อมเพย์</text>

  <!-- QR Frame -->
  <rect x="36" y="70" width="208" height="208" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

