[package]
name = "uplc-stm32f103c6-embassy"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "STM32F103C6T6 (32KB Flash / 10KB RAM) Embassy Async PLC Runtime & Micro-VM Firmware for uPLC Studio (USART1 PA9/PA10 link, ST-Link V2 upload)"

[dependencies]
# Shared no_std Micro-VM Engine from workspace
uplc-vm = { path = "../../crates/vm", features = ["compact"] } # 256 instructions (10 KB SRAM)

# Cortex-M3 Runtime (single-core critical section implementation)
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-halt = "1.0.0"
defmt = "0.3"
defmt-rtt = "0.4"

# Embassy Async Framework for STM32F1
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "defmt", "task-arena-size-1024"] } # measured: 4 tasks = 752 B (nightly -Zprint-type-sizes)
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.6" }
embassy-futures = { version = "0.1" }
# NOTE: no `memory-x` feature -> we ship our own memory.x that reserves the last 4 KB of Flash for PLC data
embassy-stm32 = { version = "0.2", features = ["stm32f103c6", "time-driver-tim2", "unstable-pac", "defmt"] }
embedded-io-async = "0.6"
static_cell = "2.1"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
panic = "abort"

[profile.dev]
# 32 KB Flash is too small for unoptimized builds - always optimize for size
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 2
