[package]
name = "uplc-rp2040-embassy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "RP2040 Embassy Async PLC Runtime & Micro-VM Firmware for uPLC Studio"

[dependencies]
# Shared no_std Micro-VM Engine from workspace
uplc-vm = { path = "../../crates/vm" }

# Cortex-M & RP2040 Runtime
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.3"
panic-halt = "1.0.0"
defmt = "0.3"
defmt-rtt = "0.4"

# Embassy Async Framework for RP2040
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "task-arena-size-32768"] }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.6" }
embassy-futures = { version = "0.1" }
embassy-rp = { version = "0.3", features = ["rp2040", "time-driver", "critical-section-impl", "defmt", "unstable-pac"] }
embassy-usb = { version = "0.4" }
embedded-io-async = "0.6"
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "s"
overflow-checks = false
